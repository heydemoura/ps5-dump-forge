[package]
name = "ps5upload-fpkg"
edition = "2021" # upstream ps5upload is 2021; kept to minimise the vendor diff
license = "GPL-3.0-or-later"
version = "7.0.22" # pinned upstream tag v7.0.22

[dependencies]
# Cross-platform OS randomness for the outer PFS seed. Opening /dev/urandom
# directly meant Windows silently fell back to the clock. Already in the tree.
getrandom = "0.4"
aes = "0.9"
flate2 = "1"
crc32fast = "1"
# Raw LZ4 blocks for AMPR asset packs (already in the tree through smb2).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] } # Forge's version (upstream 0.13): one copy in the lock
# AMPR pack profiles (drakmor's TOML format).
toml = "1"
hmac = "0.13"
sha2 = "0.11"
# Big-integer modular exponentiation for the debug license signature (pure Rust, every target).
num-bigint = "0.5"
ps5upload-pkg = { path = "../ps5upload-pkg" }
serde_json.workspace = true
libc = "0.2"
serde = { workspace = true }
sha3 = "0.12"
thiserror.workspace = true
